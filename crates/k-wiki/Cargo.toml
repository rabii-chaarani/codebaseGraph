[package]
name = "k-wiki"
version = "1.2.0"
edition = "2021"
rust-version = "1.82"
description = "OKF knowledge wiki, projection builder, and MCP service."
license = "MIT"
repository = "https://github.com/rabii-chaarani/codebaseGraph"
publish = false

[lib]
name = "k_wiki"

[[bin]]
name = "k-wiki"
path = "src/bin/k-wiki.rs"

[features]
default = []
graph-context = []

[dependencies]
ammonia = "4.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
codebase-graph = { version = "1.2.0", path = "../.." }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
walkdir = "2"
yaml_serde = "0.10"
