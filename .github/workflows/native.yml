name: Native artifact

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      run-tests:
        required: true
        type: boolean
      upload-artifact:
        required: true
        type: boolean
      artifact-retention-days:
        required: true
        type: number

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "13.3"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  native:
    name: native artifact (${{ inputs.target }})
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-latest","macos-arm64":"macos-latest","macos-x86_64":"macos-15-intel","windows-x86_64":"windows-2022"}')[inputs.target] }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source-sha }}

      - name: Set up native dependencies
        uses: ./.github/actions/setup-native
        with:
          target: ${{ inputs.target }}

      - name: Run platform tests
        id: platform_tests
        if: inputs.run-tests
        run: cargo run -p xtask -- native-test --target "${{ inputs.target }}"

      # Diagnostic retry only. The original platform-test failure remains a
      # failed required job; no profile, feature, stack size or test gate changes.
      - name: Capture Linux test stack after failure
        id: linux_stack_trace
        if: failure() && inputs.run-tests && inputs.target == 'linux-x86_64' && steps.platform_tests.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --yes gdb
          fi
          python3 .github/scripts/linux_stack_trace.py --output diagnostics/linux-stack --timeout-seconds 180

      - name: Upload Linux stack diagnostics
        if: always() && inputs.run-tests && inputs.target == 'linux-x86_64' && steps.linux_stack_trace.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-stack-diagnostics
          path: diagnostics/linux-stack/
          if-no-files-found: warn
          retention-days: 3

      - name: Build and smoke release artifact
        run: cargo run -p xtask -- native-artifact --target "${{ inputs.target }}" --commit-sha "${{ inputs.source-sha }}" --output "dist/${{ inputs.target }}"

      - name: Upload internal artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ inputs.target }}
          path: dist/${{ inputs.target }}/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
