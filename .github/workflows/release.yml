name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish-existing-tag:
        description: Existing vX.Y.Z tag for native-assets-only recovery (exclusive with resume-ci-run).
        required: false
        type: string
      resume-ci-run:
        description: Successful main CI run for a release merge; resumes native assets and crates.io.
        required: false
        type: string
      artifact-source:
        description: Existing-tag recovery only; CI-run recovery always promotes the exact run.
        required: true
        type: choice
        default: promote
        options: [promote, rebuild-if-missing]
      dry-run:
        description: Validate without creating tags, releases, labels, PRs, or publishing packages.
        required: true
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  release-target:
    name: resolve verified release target
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should-publish: ${{ steps.resolve.outputs.should-publish }}
      automatic: ${{ steps.resolve.outputs.automatic }}
      tag-name: ${{ steps.resolve.outputs.tag-name }}
      version: ${{ steps.resolve.outputs.version }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}
      release-pr: ${{ steps.verified.outputs.release-pr }}
      publish_assets: ${{ steps.resolve.outputs.publish_assets }}
      artifact-source: ${{ steps.resolve.outputs.artifact-source }}
      ci-run-id: ${{ steps.resolve.outputs.ci-run-id }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
      - name: Validate recovery inputs
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.publish-existing-tag }}
          RESUME_CI_RUN: ${{ inputs.resume-ci-run }}
          MANUAL_SOURCE: ${{ inputs.artifact-source }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ -n "$MANUAL_TAG" && -z "$RESUME_CI_RUN" || -z "$MANUAL_TAG" && -n "$RESUME_CI_RUN" ]] || {
              echo 'Choose exactly one of publish-existing-tag and resume-ci-run.' >&2; exit 1;
            }
            [[ -z "$RESUME_CI_RUN" || "$MANUAL_SOURCE" == 'promote' ]] || {
              echo 'CI-run recovery must promote the verified artifacts.' >&2; exit 1;
            }
          fi
      - name: Verify exact CI and release merge
        id: verified
        if: github.event_name == 'workflow_run' || inputs.resume-ci-run != ''
        uses: ./.github/actions/verified-release
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ci-run-id: ${{ github.event.workflow_run.id || inputs.resume-ci-run }}
          expected-sha: ${{ github.event.workflow_run.head_sha }}
          require-release: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Resolve tag and source SHA
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.publish-existing-tag }}
          MANUAL_SOURCE: ${{ inputs.artifact-source }}
          MANUAL_DRY_RUN: ${{ inputs.dry-run }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.resume-ci-run }}
          VERIFIED_SHA: ${{ steps.verified.outputs.source-sha }}
          RELEASE_PR: ${{ steps.verified.outputs.release-pr }}
        run: |
          set -euo pipefail
          tag=''
          source_sha="$VERIFIED_SHA"
          ci_run_id="$CI_RUN_ID"
          should_publish=false
          automatic=false
          artifact_source=promote
          dry_run=false
          [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]] || dry_run="$MANUAL_DRY_RUN"
          if [[ -n "$MANUAL_TAG" ]]; then
            tag="$MANUAL_TAG"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag.' >&2; exit 1; }
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            source_sha="$(jq -r .object.sha <<<"$ref")"
            if [[ "$(jq -r .object.type <<<"$ref")" == 'tag' ]]; then
              source_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$source_sha" --jq '.object.sha')"
            fi
            ci_run_id=''
            should_publish=true
            artifact_source="$MANUAL_SOURCE"
          elif [[ -n "$RELEASE_PR" ]]; then
            manifest="$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$source_sha" --jq .content | base64 --decode)"
            version="$(jq -er '.["."]' <<<"$manifest")"
            tag="v$version"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release manifest version.' >&2; exit 1; }
            automatic=true
            should_publish=true
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid source SHA.' >&2; exit 1; }
          publish_assets=false
          [[ "$should_publish" != 'true' || "$dry_run" == 'true' ]] || publish_assets=true
          {
            echo "should-publish=$should_publish"
            echo "automatic=$automatic"
            echo "tag-name=$tag"
            echo "version=${tag#v}"
            echo "source-sha=$source_sha"
            echo "publish_assets=$publish_assets"
            echo "artifact-source=$artifact_source"
            echo "ci-run-id=$ci_run_id"
            echo "dry-run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "Source: $source_sha; CI: $ci_run_id; release PR: ${RELEASE_PR:-none}; tag: ${tag:-none}; dry run: $dry_run" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out immutable metadata source
        if: steps.resolve.outputs.automatic == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.resolve.outputs.source-sha }}
          path: release-source
      - name: Prepare immutable release metadata
        if: steps.resolve.outputs.automatic == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.source-sha }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag-name }}
        run: |
          set -euo pipefail
          cargo run -p xtask --locked -- release-metadata --source-sha "$SOURCE_SHA" --source-dir release-source > release-metadata.json
          jq -e --arg sha "$SOURCE_SHA" --arg tag "$RELEASE_TAG" '.source_sha == $sha and .tag_name == $tag' release-metadata.json >/dev/null
      - name: Retain immutable release metadata
        if: steps.resolve.outputs.automatic == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: exact-SHA CI gate
    needs: release-target
    if: needs.release-target.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      ci-run-id: ${{ steps.wait.outputs.ci-run-id }}
      artifacts-available: ${{ steps.wait.outputs.artifacts-available }}
    steps:
      - name: Validate exact-SHA CI push run
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-target.outputs.source-sha }}
          AUTOMATIC: ${{ needs.release-target.outputs.automatic }}
          REQUESTED_CI_RUN_ID: ${{ needs.release-target.outputs.ci-run-id }}
        run: |
          set -euo pipefail
          if [[ "$AUTOMATIC" == 'true' ]]; then
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_CI_RUN_ID")"
            jq -e \
              --arg sha "$SOURCE_SHA" \
              --arg run_id "$REQUESTED_CI_RUN_ID" \
              '.id == ($run_id | tonumber)
               and .path == ".github/workflows/ci.yml"
               and .event == "push"
               and .head_branch == "main"
               and .head_sha == $sha
               and .status == "completed"
               and .conclusion == "success"' <<<"$run" >/dev/null || {
                echo "Triggering workflow run does not satisfy the exact-SHA main CI contract." >&2
                exit 1
              }
            artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_CI_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("native-")))] | length')"
            {
              echo "ci-run-id=$REQUESTED_CI_RUN_ID"
              if [[ "$artifact_count" == '4' ]]; then
                echo 'artifacts-available=true'
              else
                echo 'artifacts-available=false'
              fi
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$SOURCE_SHA&per_page=100")"
            run_id="$(jq -r --arg sha "$SOURCE_SHA" '[.[].workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/ci.yml" and .event == "push" and .status == "completed" and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("native-")))] | length')"
              {
                echo "ci-run-id=$run_id"
                if [[ "$artifact_count" == '4' ]]; then
                  echo "artifacts-available=true"
                else
                  echo "artifacts-available=false"
                fi
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            failed="$(jq -r --arg sha "$SOURCE_SHA" '[.[].workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/ci.yml" and .event == "push" and .status == "completed" and .conclusion != "success")] | length' <<<"$runs")"
            if [[ "$failed" != '0' ]]; then
              echo "Exact-SHA CI completed without success for $SOURCE_SHA." >&2
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for successful CI for $SOURCE_SHA." >&2
          exit 1

  production-gate:
    name: production release gate
    needs:
      - release-target
      - ci-gate
    if: needs.release-target.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cargo
    permissions:
      contents: read
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.release-target.outputs.source-sha }}
      - name: Verify package version matches tag
        run: cargo run -p xtask -- verify-release-version "${{ needs.release-target.outputs.tag-name }}"
      - name: Run production repository gate
        shell: bash
        env:
          CODEBASE_GRAPH_CONFIRM_RELEASE_ENVIRONMENT: ${{ vars.CODEBASE_GRAPH_CONFIRM_RELEASE_ENVIRONMENT }}
          CODEBASE_GRAPH_CONFIRM_PRIVATE_VULNERABILITY_REPORTING: ${{ vars.CODEBASE_GRAPH_CONFIRM_PRIVATE_VULNERABILITY_REPORTING }}
          CODEBASE_GRAPH_REQUIRE_CONDA: ${{ vars.CODEBASE_GRAPH_REQUIRE_CONDA }}
        run: |
          set -euo pipefail
          args=(release-gate --production)
          [[ "$CODEBASE_GRAPH_CONFIRM_RELEASE_ENVIRONMENT" == 'true' ]] && args+=(--confirm release-environment)
          [[ "$CODEBASE_GRAPH_CONFIRM_PRIVATE_VULNERABILITY_REPORTING" == 'true' ]] && args+=(--confirm private-vulnerability-reporting)
          [[ "$CODEBASE_GRAPH_REQUIRE_CONDA" == 'true' ]] && args+=(--require-conda)
          cargo run -p xtask -- "${args[@]}"

  select-artifacts:
    name: select artifact source
    needs:
      - release-target
      - ci-gate
      - production-gate
    if: needs.release-target.outputs.should-publish == 'true'
    environment:
      name: cargo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.select.outputs.rebuild }}
    steps:
      - name: Select promotion or all-target rebuild
        id: select
        shell: bash
        env:
          ARTIFACT_SOURCE: ${{ needs.release-target.outputs.artifact-source }}
          ARTIFACTS_AVAILABLE: ${{ needs.ci-gate.outputs.artifacts-available }}
          AUTOMATIC: ${{ needs.release-target.outputs.automatic }}
        run: |
          set -euo pipefail
          if [[ "$ARTIFACTS_AVAILABLE" == 'true' ]]; then
            echo 'rebuild=false' >> "$GITHUB_OUTPUT"
          elif [[ "$AUTOMATIC" == 'false' && "$ARTIFACT_SOURCE" == 'rebuild-if-missing' ]]; then
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Exact-SHA CI artifacts are missing or expired; select rebuild-if-missing for manual recovery.' >&2
            exit 1
          fi

  rebuild-artifacts:
    name: rebuild (${{ matrix.target }})
    needs:
      - release-target
      - select-artifacts
    if: ${{ needs.select-artifacts.outputs.rebuild == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x86_64
          - macos-arm64
          - macos-x86_64
          - windows-x86_64
    uses: ./.github/workflows/native.yml
    with:
      target: ${{ matrix.target }}
      source-sha: ${{ needs.release-target.outputs.source-sha }}
      run-tests: false
      upload-artifact: true
      artifact-retention-days: 7

  validate-artifacts:
    name: validate complete native artifact set
    needs:
      - release-target
      - ci-gate
      - select-artifacts
      - rebuild-artifacts
    if: ${{ always() && needs.select-artifacts.result == 'success' && (needs.rebuild-artifacts.result == 'success' || needs.rebuild-artifacts.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    environment:
      name: cargo
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.release-target.outputs.source-sha }}
      - name: Download promoted CI artifacts
        if: needs.select-artifacts.outputs.rebuild == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.ci-gate.outputs.ci-run-id }}
          pattern: native-*
          path: dist/native
          github-token: ${{ github.token }}
      - name: Download rebuilt artifacts
        if: needs.select-artifacts.outputs.rebuild == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist/native
      - name: Validate checksums, provenance, and archive contract
        run: cargo run -p xtask -- validate-native-artifacts --input dist/native --tag "${{ needs.release-target.outputs.tag-name }}" --commit-sha "${{ needs.release-target.outputs.source-sha }}"
      - name: Stage complete validated set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          while IFS= read -r -d '' artifact; do cp "$artifact" dist/release-assets/; done < <(find dist/native -type f -name 'codebase-graph-*.tar.gz' -print0)
          while IFS= read -r -d '' checksum; do cp "$checksum" dist/release-assets/; done < <(find dist/native -type f -name 'codebase-graph-*.tar.gz.sha256' -print0)
          test "$(find dist/release-assets -type f | wc -l | tr -d ' ')" = '8'
      - name: Upload validated release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-assets
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 7

  publish-release-assets:
    name: publish release assets
    needs:
      - release-target
      - validate-artifacts
    # Artifact promotion intentionally skips rebuild-artifacts. Override that skipped
    # ancestor only after every direct publication prerequisite succeeds.
    if: >-
      ${{
        always()
        && needs.release-target.result == 'success'
        && needs.validate-artifacts.result == 'success'
        && needs.release-target.outputs.publish_assets == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cargo
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
      - name: Revalidate exact release before publication
        id: verified
        if: needs.release-target.outputs.automatic == 'true'
        uses: ./.github/actions/verified-release
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ci-run-id: ${{ needs.release-target.outputs.ci-run-id }}
          expected-sha: ${{ needs.release-target.outputs.source-sha }}
          require-release: 'true'
      - name: Download immutable release metadata
        if: needs.release-target.outputs.automatic == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: dist/metadata
      - name: Download validated release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-assets
          path: dist/release-assets
      - name: Create only the verified release
        if: needs.release-target.outputs.automatic == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          SOURCE_SHA: ${{ needs.release-target.outputs.source-sha }}
          RELEASE_TAG: ${{ needs.release-target.outputs.tag-name }}
          RELEASE_PR: ${{ needs.release-target.outputs.release-pr }}
          VERIFIED_PR: ${{ steps.verified.outputs.release-pr }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_PR" == "$RELEASE_PR" ]] || { echo 'Release PR identity changed.' >&2; exit 1; }
          jq -e --arg sha "$SOURCE_SHA" --arg tag "$RELEASE_TAG" '.source_sha == $sha and .tag_name == $tag' dist/metadata/release-metadata.json >/dev/null
          optional_get() {
            local response
            if response="$(gh api "$1" 2>"$RUNNER_TEMP/release-api-error")"; then
              printf '%s' "$response"
            elif jq -e '.status == "404"' <<<"$response" >/dev/null 2>&1; then
              printf 'null'
            else
              cat "$RUNNER_TEMP/release-api-error" >&2
              return 1
            fi
          }
          ref="$(optional_get "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          if [[ "$ref" == 'null' ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" >/dev/null || {
              echo 'Cannot create the exact tag. Historical workflow changes may require RELEASE_PUBLISH_TOKEN with Contents and Workflows write permissions.' >&2; exit 1;
            }
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          fi
          tag_sha="$(jq -r .object.sha <<<"$ref")"
          if [[ "$(jq -r .object.type <<<"$ref")" == 'tag' ]]; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
          fi
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || { echo 'Existing release tag points to a different commit.' >&2; exit 1; }
          release="$(optional_get "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$release" == 'null' ]]; then
            releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
            latest="$(jq -r --arg tag "$RELEASE_TAG" \
              '($tag | ltrimstr("v") | split(".") | map(tonumber)) as $version |
               [.[][] | select(.draft == false and .prerelease == false)
                | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                | ltrimstr("v") | split(".") | map(tonumber)] | all(. < $version)' <<<"$releases")"
            jq --arg latest "$latest" \
              '{tag_name, target_commitish: .source_sha, name: .tag_name, body: .notes,
                draft: false, prerelease: false, make_latest: $latest}' \
              dist/metadata/release-metadata.json > "$RUNNER_TEMP/release-request.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input "$RUNNER_TEMP/release-request.json" >/dev/null
          else
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' <<<"$release" >/dev/null
          fi
      - name: Upload complete native asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-target.outputs.tag-name }}" dist/release-assets/codebase-graph-*.tar.gz dist/release-assets/codebase-graph-*.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  publish-crate:
    name: publish crates.io package
    needs:
      - release-target
      - publish-release-assets
    # Keep the explicit status override through the final job so the intentionally
    # skipped rebuild ancestor cannot suppress crate publication either.
    if: >-
      ${{
        always()
        && needs.release-target.result == 'success'
        && needs.publish-release-assets.result == 'success'
        && needs.release-target.outputs.automatic == 'true'
        && needs.release-target.outputs.publish_assets == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cargo
    permissions:
      contents: read
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.release-target.outputs.source-sha }}
      - name: Verify crates.io package
        run: cargo publish --dry-run --locked
      - name: Enforce crates.io package size limit
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          crate_path="$(find target/package -maxdepth 1 -type f -name 'codebase-graph-*.crate' -print -quit)"
          test -n "$crate_path"
          cargo run -p xtask -- verify-crate-size "$crate_path"
      - name: Publish crates.io package
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE_NAME: codebase-graph
          CRATE_VERSION: ${{ needs.release-target.outputs.version }}
        run: |
          set -euo pipefail

          version_is_published() {
            curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --user-agent "codebaseGraph-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$CRATE_NAME/$CRATE_VERSION" \
              >/dev/null 2>&1
          }

          if version_is_published; then
            echo "$CRATE_NAME $CRATE_VERSION is already published; nothing to do."
            exit 0
          fi

          max_attempts=4
          for (( attempt=1; attempt<=max_attempts; attempt++ )); do
            echo "Publishing $CRATE_NAME $CRATE_VERSION (attempt $attempt/$max_attempts)."
            if cargo publish --locked; then
              exit 0
            else
              publish_status=$?
            fi

            # An upload can succeed even when the client loses the response. Treat the
            # immutable version appearing in the registry as authoritative success.
            if version_is_published; then
              echo "$CRATE_NAME $CRATE_VERSION is now visible on crates.io."
              exit 0
            fi
            if (( attempt == max_attempts )); then
              echo "Failed to publish $CRATE_NAME $CRATE_VERSION after $max_attempts attempts." >&2
              exit "$publish_status"
            fi

            sleep_seconds=$((15 * attempt))
            echo "Publish failed; retrying in $sleep_seconds seconds."
            sleep "$sleep_seconds"
          done

  finalize-release:
    name: finalize verified release PR
    needs: [release-target, publish-release-assets, publish-crate]
    if: ${{ always() && needs.release-target.result == 'success' && needs.publish-release-assets.result == 'success' && needs.publish-crate.result == 'success' && needs.release-target.outputs.automatic == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mark only the completed release PR tagged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ needs.release-target.outputs.release-pr }}
        run: |
          set -euo pipefail
          gh pr edit "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --add-label 'autorelease: tagged' --remove-label 'autorelease: pending'

  release-please:
    name: maintain release proposal
    needs: [release-target, finalize-release]
    if: ${{ always() && needs.release-target.result == 'success' && needs.release-target.outputs.dry-run == 'false' && (github.event_name == 'workflow_run' || inputs.resume-ci-run != '') && (needs.release-target.outputs.should-publish == 'false' || needs.finalize-release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Verify current main CI and detect blocked proposals
        id: proposal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$main_sha&per_page=100")"
          if ! jq -e --arg sha "$main_sha" 'any(.[].workflow_runs[]; .head_sha == $sha and .path == ".github/workflows/ci.yml" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
            echo 'Waiting for successful CI of current main before maintaining the next release proposal.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pulls="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100")"
          pending="$(jq -r --arg repository "$GITHUB_REPOSITORY"             '[.[][] | select(.merged_at != null and .head.repo.full_name == $repository)
              | select(.head.ref == "release-please--branches--main--components--codebase-graph")
              | select(any(.labels[]; .name == "autorelease: pending")) | .number] | join(", ")' <<<"$pulls")"
          if [[ -n "$pending" ]]; then
            echo "::error::Merged release PRs $pending remain unpublished. Resume each release merge's successful CI using resume-ci-run."
            echo "Blocked by unpublished release PRs: $pending" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current" != "$main_sha" ]] || echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Create or update release PR only
        id: release
        if: steps.proposal.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
